[[items]]
title = "Talk to TR 与 The Living Library"
subtitle = "实时具身对话式 AI · 西奥多·罗斯福总统图书馆"
date = "2025 – 2026"
content = """
一个持续运行的博物馆展项：参观者可以与真人大小的西奥多·罗斯福数字人面对面对话，回答内容基于约 30 万条经过审核的档案记录。

- **问题：** 如何把分散的数字档案变成既能自然对话、又忠于史实的体验。
- **方法：** OCR 与元数据增强加馆员审核、稠密/语义混合检索、智能体推理、端到端流式响应，以及面向无人值守运行的数字人交互。
- **我的工作：** 论文第一作者；参与智能体编排、对话与会话管理、实时体验以及系统可靠性建设。

[论文](https://arxiv.org/abs/2609.09368) · [代码](https://github.com/microsoft/TRPL)
"""
tags = ["智能体", "检索增强生成", "数字人", "文化遗产"]
link = "https://arxiv.org/abs/2609.09368"

[[items]]
title = "深度伪造与 AI 生成内容检测"
subtitle = "媒体真实性研究 · 微软 AI for Good Lab"
date = "2025 – 2026"
content = """
研究机器和人类分辨真实媒体与 AI 生成或篡改内容的能力。

- **评测基准：** 参与构建 Microsoft-Northwestern-WITNESS 基准，包含 5 万多个图像、视频和音频样本，以及由专家标注、来自记者和人权工作者的真实案例（IEEE Intelligent Systems，2026）。
- **人类实验：** 分析了 12,500 多名参与者的约 28.7 万次判断，发现人们识别 AI 生成图像的正确率只有 62%。

[MNW 基准](https://doi.org/10.1109/MIS.2026.3668398) · [人类实验](https://arxiv.org/abs/2507.18640)
"""
tags = ["深度伪造检测", "评测基准", "多模态", "负责任 AI"]

[[items]]
title = "面向生态学的视觉语言模型"
subtitle = "用于生物多样性监测的多模态 AI"
date = "2025 – 2026"
content = """
将视觉语言模型适配到生态图像上，用于野生动物识别与图像描述，帮助研究人员处理海量野外数据。

- **重点：** 开源 VLM 的领域适配与微调、多模态评测，以及高效的 GPU 训练。
- **论文：** 合著关于多模态语言模型用于生物多样性研究与保护的综述（Methods in Ecology and Evolution，2025）。

[论文](https://doi.org/10.1111/2041-210X.70120)
"""
tags = ["视觉语言模型", "微调", "计算机视觉", "生态学"]

[[items]]
title = "基于 CT 的三维主动脉分割"
subtitle = "心血管影像深度学习 · 迈阿密大学"
date = "2022 – 2024"
content = """
研究生阶段的科研：从 CT 图像中重建人体主动脉几何结构，这是用机器学习辅助诊断胸主动脉瘤等疾病的前提。

- **研究：** 在形态差异很大的主动脉数据上比较 2D 与 3D U-Net 分割效果。3D U-Net 避免了逐切片分割造成的血管壁断裂，但部分病例的 HD95 误差仍然较大，为后续更先进的网络结构提供了基线。

[预印本](https://doi.org/10.1101/2024.10.02.616348)
"""
tags = ["医学影像", "三维分割", "U-Net", "心血管"]
